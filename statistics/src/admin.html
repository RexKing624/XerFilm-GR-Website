<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>XerFilm · 下载统计</title><style>
:root{color-scheme:dark;--bg:#151714;--card:#1e221b;--fg:#eeeedc;--muted:#a5ac9c;--line:#3b4234;--accent:#d3e68c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,sans-serif}main{max-width:1200px;margin:auto;padding:36px 28px 70px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:22px;gap:20px}a{color:var(--muted);text-underline-offset:5px}small,.muted{color:var(--muted)}.eyebrow{font:12px ui-monospace,monospace;letter-spacing:.15em}h1{font-size:36px;letter-spacing:-.04em;margin:8px 0 0}h2{font-size:20px;font-weight:500;margin:0 0 18px}p{margin:12px 0}button,input{font:inherit;border:1px solid var(--line);padding:11px 16px;background:transparent;color:var(--fg);border-radius:0}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}button:hover{border-color:var(--accent)}.primary{background:var(--accent);color:#151714;border-color:var(--accent)}.login{max-width:480px;margin:90px auto;padding:32px;border:1px solid var(--line)}.login input{width:100%;margin:10px 0 16px}.login button{width:100%}.error{color:#f39c8b;min-height:1.6em}.toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px;margin:32px 0 22px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters button[aria-pressed=true]{color:var(--accent);border-color:var(--accent)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);margin-bottom:30px}.metric{padding:24px;border-right:1px solid var(--line)}.metric:last-child{border:0}.metric strong{display:block;font:42px/1.4 ui-monospace,monospace}.metric span{color:var(--muted);font-size:14px}.panel{border:1px solid var(--line);background:var(--card);padding:24px;margin:22px 0}.chart{height:155px;display:flex;gap:5px;align-items:end;border-bottom:1px solid var(--line)}.bar{flex:1;min-width:2px;background:var(--accent);opacity:.8;position:relative}.bar:hover{opacity:1}.chart-caption{display:flex;justify-content:space-between;margin-top:9px;color:var(--muted);font-size:12px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap;text-align:left}th{font-weight:400;color:var(--muted);font-size:13px}th,td{padding:14px 12px;border-bottom:1px solid var(--line)}th:first-child,td:first-child{padding-left:0}th:last-child,td:last-child{text-align:right;padding-right:0}.footer{border-top:1px solid var(--line);padding-top:22px;color:var(--muted);font-size:13px}.footer a{margin-right:22px}[hidden]{display:none!important}@media(max-width:700px){main{padding:24px 18px}.metrics{grid-template-columns:repeat(2,1fr)}.metric:nth-child(2){border-right:0}.metric:nth-child(-n+2){border-bottom:1px solid var(--line)}h1{font-size:29px}.metric{padding:18px}.metric strong{font-size:32px}.panel{padding:18px}}
</style></head><body><main><header><div><div class="eyebrow">XERFILM / PRIVATE STATISTICS</div><h1>每一次下载，留个数。</h1></div><a href="https://filmgr.xergnik.com/" target="_blank" rel="noopener">返回官网 ↗</a></header>
<section class="login" id="login"><h2>下载统计</h2><p class="muted">输入管理口令查看。口令仅在当前页面内存中保留。</p><form id="login-form"><label for="token">管理口令</label><input id="token" type="password" autocomplete="off" required><button class="primary" id="login-button">查看统计 ↗</button><p class="error" id="login-error" role="alert"></p></form></section>
<section id="dashboard" hidden><div class="toolbar"><div><p class="eyebrow" id="period"></p><small id="updated"></small></div><div><button id="refresh">刷新 ↻</button> <button id="logout">退出</button></div></div><div class="metrics"><div class="metric"><strong id="total">0</strong><span>累计固件下载</span></div><div class="metric"><strong id="today">0</strong><span>今日固件下载</span></div><div class="metric"><strong id="month">0</strong><span>本月固件下载</span></div><div class="metric"><strong id="community">0</strong><span>所选期间 · 社群效果</span></div></div><div class="toolbar"><div class="filters" id="filters"><button data-days="7">近 7 天</button><button data-days="30" aria-pressed="true">近 30 天</button><button data-days="90">近 90 天</button><button data-days="all">全部</button></div><button id="csv">导出 CSV ↓</button></div><p class="error" id="data-error" role="alert"></p><section class="panel"><h2>固件下载趋势</h2><div class="chart" id="chart" aria-label="每天固件下载量"></div><div class="chart-caption"><span id="from"></span><span id="chart-hint"></span><span id="to"></span></div></section><section class="panel"><h2>机型与版本</h2><div class="table-wrap"><table><thead><tr><th>类型 / 机型</th><th>版本</th><th>普通 / 增强</th><th>包编号</th><th>下载次数</th></tr></thead><tbody id="rows"></tbody></table></div><p class="muted" id="empty">这段时间还没有记录。</p></section><footer class="footer"><p>从 2026-10-25 开始记录 · 以日本时间划分日期。统计完整校验通过并触发保存的次数，无法确认用户最终写入磁盘或刷入相机。不记录设备码、照片、IP 或访客身份。</p><p><a href="https://filmgr.xergnik.com/?download-statistics=off" target="_blank" rel="noopener">排除这个浏览器的测试下载 ↗</a><a href="https://filmgr.xergnik.com/?download-statistics=on" target="_blank" rel="noopener">恢复这个浏览器的统计 ↗</a></p></footer></section></main>
<script nonce="__NONCE__">
const $=id=>document.getElementById(id);let token='',current,days='30';const models={gr3:'GR III / HDF',gr3x:'GR IIIx / HDF',gr4:'GR IV / HDF',community:'社群效果'},variants={standard:'普通版',enhanced:'增强版',original:'原厂备份',community:'效果包'};
function day(d){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}
function range(){const to=day(new Date()),from=days==='all'?'2026-10-25':day(new Date(Date.now()-(Number(days)-1)*86400000));return new URLSearchParams({from,to})}
async function load(){const r=await fetch('/api/stats?'+range(),{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(!r.ok)throw Error(r.status===401?'管理口令不正确。':'暂时无法读取，请稍后重试。');current=await r.json();render();}
function render(){const d=current;$('total').textContent=d.summary.total;$('today').textContent=d.summary.today;$('month').textContent=d.summary.month;$('community').textContent=d.kinds.find(x=>x.kind==='community')?.count||0;$('period').textContent='记录始于 '+d.startDate+' · '+d.timeZone;$('updated').textContent='更新于 '+new Date(d.generatedAt).toLocaleString('zh-CN',{timeZone:d.timeZone});$('from').textContent=d.from;$('to').textContent=d.to;
 const points=new Map(d.daily.filter(x=>x.kind==='firmware').map(x=>[x.day,x.count]));const bars=[];for(let time=Date.parse(d.from);time<=Date.parse(d.to)&&bars.length<3660;time+=86400000){const date=new Date(time).toISOString().slice(0,10);bars.push([date,points.get(date)||0])}const max=Math.max(1,...bars.map(x=>x[1]));$('chart').replaceChildren(...bars.map(([date,count])=>{const b=document.createElement('div');b.className='bar';b.style.height=Math.max(1,count/max*145)+'px';b.title=date+' · '+count+' 次';b.setAttribute('aria-label',b.title);return b}));$('chart-hint').textContent='最高 '+Math.max(0,...bars.map(x=>x[1]))+' 次 / 天';$('rows').replaceChildren(...d.downloads.map(x=>{const row=document.createElement('tr');for(const value of [(x.kind==='original'?'原厂 · ':'')+models[x.model],x.version,variants[x.variant],x.revision,x.count]){const cell=document.createElement('td');cell.textContent=value;row.append(cell)}return row}));$('empty').hidden=d.downloads.length>0;$('login').hidden=true;$('dashboard').hidden=false;for(const button of document.querySelectorAll('[data-days]'))button.setAttribute('aria-pressed',String(button.dataset.days===days));}
$('login-form').addEventListener('submit',async e=>{e.preventDefault();token=$('token').value.trim();$('login-button').disabled=true;$('login-error').textContent='';try{await load();$('token').value=''}catch(e){token='';$('login-error').textContent=e.message}finally{$('login-button').disabled=false}});
$('logout').onclick=()=>{token='';current=null;$('dashboard').hidden=true;$('login').hidden=false;$('token').value='';$('rows').replaceChildren();$('chart').replaceChildren();$('token').focus()};
async function refresh(){const b=$('refresh');b.disabled=true;$('data-error').textContent='';try{await load()}catch(e){$('data-error').textContent=e.message}finally{b.disabled=false}}$('refresh').onclick=refresh;$('filters').onclick=e=>{const button=e.target.closest('[data-days]');if(button){days=button.dataset.days;void refresh()}};
$('csv').onclick=()=>{if(!current)return;const csv=[['类型','机型','版本','变体','编号','下载次数'],...current.downloads.map(x=>[x.kind,x.model,x.version,x.variant,x.revision,x.count])].map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='XerFilm-downloads-'+current.from+'-'+current.to+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></body></html>
